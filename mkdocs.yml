site_name: NUTRIx Knowledge Base
site_description: >-
  Knowledge base and community hub of the NUTRIx scientific network on
  computational nutrition science, funded by the Deutsche Forschungsgemeinschaft
  (DFG).
site_url: https://nutrixnetwork.github.io/knowledge_base/
site_author: NUTRIx Network

repo_url: https://github.com/NUTRIxNetwork/knowledge_base
repo_name: NUTRIxNetwork/knowledge_base
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; NUTRIx Network &mdash; content CC BY 4.0, code MIT.
  A DFG-funded scientific network.

theme:
  name: material
  language: en
  logo: assets/nutrix-mark-light.svg
  favicon: assets/nutrix-mark.svg
  font:
    text: Atkinson Hyperlegible
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - About:
      - about/index.md
      - The network: about/network.md
      - Members: about/members.md
      - Funding: about/funding.md
  - Meetings:
      - meetings/index.md
      - 2027 — Atlanta: meetings/2027-atlanta.md
      - 2028 — Nuthetal: meetings/2028-nuthetal.md
      - 2029 — Kiel: meetings/2029-kiel.md
  - Getting Started:
      - getting-started/index.md
      - Quickstart: getting-started/quickstart.md
      - Environments: getting-started/environments.md
      - How to contribute: getting-started/how-to-contribute.md
  - Foundations:
      - foundations/index.md
      - FAIR data management: foundations/fair-data-management.md
      - Reproducibility: foundations/reproducibility.md
      - Containerisation: foundations/containerisation.md
      - Data governance & ethics: foundations/data-governance-ethics.md
      - Glossary: foundations/glossary.md
  - Research Areas:
      - research-areas/index.md
      - Area 1 — Diet & Survival:
          - research-areas/area-1-diet-survival/index.md
      - Area 2 — Reproducible ML:
          - research-areas/area-2-reproducible-ml/index.md
      - Area 3 — Multi-omics Integration:
          - research-areas/area-3-multiomics/index.md
